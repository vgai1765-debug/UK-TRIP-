 photo stop.","Beatles Statue":"Bronze statue of the four Beatles on the Liverpool waterfront. Popular photo spot, best early before crowds.","Pier Head":"Waterfront area with the famous Three Graces buildings. Pair it with the Beatles statue.","Royal Albert Dock":"Restored dockside with cafés, shops and museums. Good lunch stop between sights.","The Beatles Story":"Museum at Royal Albert Dock. Allow about 90 minutes and book ahead.","Mathew Street":"Lively street of music-themed bars and Beatles tributes, home of the Cavern Club.","Cavern Club":"Famous Beatles venue. The current club is a reconstruction, with live music most days; check the schedule.","Anfield Stadium":"Liverpool FC’s home. The tour and museum is a full visit, so book ahead.","The Kop":"Anfield’s famous stand, usually seen on the stadium tour.","Bill Shankly statue":"Bronze statue of the legendary manager outside Anfield. Photo stop.","Hillsborough Memorial":"Memorial at Anfield to the 97 people who died in the 1989 disaster. Please visit quietly and respectfully.","The Albert pub":"Pub by the ground, popular with fans. Check opening hours, especially on non-match days.","Silverstone Circuit":"Home of the British Grand Prix. Reach it on race days by the official shuttle from Northampton, not from Wellingborough directly.","Northampton Station":"Rail station used only as the shuttle connection; the race is at Silverstone.","Berwick Street":"Soho street seen on the cover of Oasis’s (What’s the Story) Morning Glory? Quick photo stop, with a market and record shops nearby.","Balfron Tower":"Brutalist tower in Poplar, East London. The Oasis link needs verifying. A far trip from central sights, so plan transport.","Unit 217B Woolwich":"Unverified fan location. Confirm the address and relevance before travelling out to Woolwich.","Trafalgar Square":"Central London square with Nelson’s Column. A One Direction “One Thing” video location per your plan.","Battersea Park":"Large riverside park. A One Direction else if(a=="up"||a=="dn"){const L=S.acts.filter(x=>x.day==S.acts.find(y=>y.id==id).day).sort((p,q)=>tm(p.start)-tm(q.start)),i=L.findIndex(x=>x.id==id),j=a=="up"?i-1:i+1;if(j<0||j>=L.length)return;const p=L[i],q=L[j];[p.start,q.start]=[q.start,p.start];[p.end,q.end]=[q.end,p.end];save();go()}
else if(a=="vis"||a=="fav"){const p=S.pl.find(x=>x.id==id);p[a=="vis"?"visited":"fav"]^=1;save();go()}
else if(a=="today"){const p=S.pl.find(x=>x.id==id);openForm("acts",{day:selDay,name:p.name,start:"09:00",end:fm(540+p.dur),loc:p.city,area:"",cat:p.cat,transport:"Walk / local transport",cost:0,status:"Planned",priority:p.priority,book:false,flag:false,notes:""},r=>{r.id=uid();r.done=false;S.acts.push(r);save();toast("Added to "+DL(r.day));go()})}
else if(a=="csv"){const L=S[k],ks=Object.keys(L[0]||{}).filter(x=>x!="id"),c=[ks.join(",")].concat(L.map(r=>ks.map(x=>'"'+String(r[x]).replace(/"/g,'""')+'"').join(","))).join("\n");const d=$("#dlg");d.innerHTML=`<h2>CSV</h2><p class=mut>Select all and copy.</p><textarea rows=10>${esc(c)}</textarea><button id=cx>Close</button>`;d.showModal();$("#cx").onclick=()=>d.close()}});
document.addEventListener("change",e=>{const t=e.target,a=t.dataset.a;if(!a)return;
if(a=="done"){S.acts.find(x=>x.id==t.dataset.id).done=t.checked}else if(a=="view")view=t.value;else if(a=="selday")selDay=t.value;
else if(a=="plc")pl.city=t.value;else if(a=="plt")pl.cat=t.value;else if(a=="rate")S.rate=Math.max(0,+t.value||0);
else if(a=="chk")S.chk[t.dataset.c]=t.checked;else if(a=="name")S.names[+t.dataset.i]=t.value.trim()||"Traveller "+(+t.dataset.i+1);else if(a=="role")S.roles[+t.dataset.i]=t.value;else if(a=="gnotes")S.notes=t.value;else return;
save();go()});
document.addEventListener("input",e=>{if(e.target.dataset.a=="plq"){pl.q=e.target.value;const p=e.target.selectionStart;go();const i=$("[data-a=plq]");i.focus();i.setSelectionRange(p,p)}});
go();
// ---- shared sync (Netlify function + Blobs). Falls back to local-only if /api/state is missing ----
const LS=["acts","pl","tr","ex","bk","tasks"],MK=KEY+"-sync",CK=KEY+"-code";
let M;try{M=JSON.parse(localStorage.getItem(MK))}catch(e){}
const kvNow=()=>{const o={names:S.names,roles:S.roles,rate:S.rate,notes:S.notes};for(const c in S.chk)o["chk:"+c]=S.chk[c];return o};
const snapAll=()=>{const s={};LS.forEach(k=>(S[k]||[]).forEach(x=>{const{_u,...r}=x;s[x.id]=JSON.stringify(r)}));return s};
const persist=()=>{try{localStorage.setItem(MK,JSON.stringify(M))}catch(e){}};
if(!M){M={rev:-1,snap:snapAll(),kv:{},tomb:{},dirty:true,v:0};const k=kvNow();for(const x in k)M.kv[x]={j:JSON.stringify(k[x]),t:0};persist()}
function stamp(){const now=Date.now(),cur=snapAll();LS.forEach(k=>(S[k]||[]).forEach(x=>{const{_u,...r}=x;if(M.snap[x.id]!==JSON.stringify(r))x._u=now}));
for(const id in M.snap)if(!(id in cur))M.tomb[id]=now;
const kv=kvNow();for(const k in kv){const j=JSON.stringify(kv[k]);if(!M.kv[k]||M.kv[k].j!==j)M.kv[k]={j,t:now}}
M.snap=snapAll();M.dirty=true;M.v=(M.v||0)+1;persist()}
function apply(d){LS.forEach(k=>{S[k]=d.lists[k]||[]});for(const k in d.kv){const{v,t}=d.kv[k];if(k.startsWith("chk:"))S.chk[k.slice(4)]=v;else S[k]=v;M.kv[k]={j:JSON.stringify(v),t}}
M.snap=snapAll();M.rev=d.rev;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const SYT={ok:"🟢 Shared · up to date",sync:"🔄 Syncing…",off:"⚪ Offline · changes will sync later",code:"🔒 Tap to enter trip code",err:"🟠 Sync problem · retrying",local:"💾 Saved on this device only"};
const setSt=s=>{const e=$("#sy");if(e)e.textContent=SYT[s]||""};
const isBusy=()=>$("#dlg").open||["INPUT","TEXTAREA","SELECT"].includes(document.activeElement&&document.activeElement.tagName);
let inflight=false,need=0,T;
function render(){if(isBusy())need=1;else go()}
function push(){clearTimeout(T);T=setTimeout(sync,800)}
function askCode(){const d=$("#dlg");d.innerHTML=`<h2>Trip code</h2><p class=mut>Enter the shared code your group uses. It is stored on this device only.</p><input id=tc autocomplete=off autocapitalize=off><div class=row style="margin-top:8px"><button id=tcs>Connect</button><button class=s id=tcx>Later</button></div>`;d.showModal();$("#tcx").onclick=()=>d.close();$("#tcs").onclick=()=>{const v=$("#tc").value.trim();if(v){localStorage.setItem(CK,v);d.close();sync()}}}
async function sync(){if(inflight)return;if(!navigator.onLine){setSt("off");return}const code=localStorage.getItem(CK);if(!code){setSt("code");return}
inflight=true;setSt("sync");const v=M.v;
try{const h={"x-trip-code":code};let r;
if(M.dirty){const lists={};LS.forEach(k=>lists[k]=S[k]||[]);const now=kvNow(),kv={};for(const k in M.kv)if(k in now)kv[k]={v:now[k],t:M.kv[k].t};
r=await fetch("/api/state",{method:"POST",headers:{...h,"content-type":"application/json"},body:JSON.stringify({lists,tomb:M.tomb,kv})})}
else r=await fetch("/api/state?since="+M.rev,{headers:h});
if(r.status==401){localStorage.removeItem(CK);setSt("code");askCode();return}
if(r.status==404){setSt("local");return}
if(!r.ok)throw 0;const d=await r.json();
if(M.v!==v){setSt("sync");persist();push();return}
if(!d.same){apply(d);M.tomb={};M.dirty=false;persist();render()}else{M.dirty=false;persist()}
setSt("ok")}catch(e){setSt("err")}finally{inflight=false}}
const syEl=$("#sy");if(syEl)syEl.onclick=()=>localStorage.getItem(CK)?sync():askCode();
setInterval(()=>{if(document.visibilityState=="visible")sync();if(need&&!isBusy()){need=0;go()}},4000);
addEventListener("online",sync);document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible")sync()});
if(!localStorage.getItem(CK))setTimeout(()=>{setSt("code");askCode()},600);else sync();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
